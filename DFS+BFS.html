<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Pathfinding Visualizer</title>
    <style>
        /* --- CSS STYLING --- */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: #f0f2f5; 
            margin: 0;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        
        button { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 5px; 
            background-color: #2c3e50; 
            color: white; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1a252f; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }

        /* Grid Configuration */
        #grid { 
            display: grid; 
            gap: 1px; 
            background-color: #bdc3c7; 
            border: 2px solid #34495e; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .cell { 
            width: 25px; 
            height: 25px; 
            background-color: white; 
            cursor: pointer; 
            /* Subtle transition for standard state changes */
            transition: background-color 0.1s ease-out; 
        }

        /* Distinct visual states for the nodes */
        .wall { background-color: #2c3e50; animation: pop 0.2s ease-out; }
        .start { background-color: #2ecc71; border-radius: 5px;}
        .target { background-color: #e74c3c; border-radius: 5px;}
        
        /* Visited nodes get a nice ripple animation */
        .visited { 
            background-color: #3498db; 
            animation: pulse 0.5s ease-out;
        }
        
        /* The final traced path */
        .path { 
            background-color: #f1c40f; 
            animation: pulse 0.3s ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.3); border-radius: 100%; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @keyframes pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Intelligent Agent Pathfinding</h2>
        <p>Click and drag to draw walls. Green is Start, Red is Target.</p>
    </div>

    <!-- HTML Updates: Added IDs to buttons so we can disable them during animation -->
    <div class="controls">
        <button id="btn-bfs" onclick="runAlgorithm('bfs')">Run BFS (Shortest Path)</button>
        <button id="btn-dfs" onclick="runAlgorithm('dfs')">Run DFS (Deep Path)</button>
        <button id="btn-clear" onclick="clearGrid()">Clear Board</button>
    </div>

    <div id="grid"></div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */
        const rows = 20;
        const cols = 40;
        const gridElement = document.getElementById('grid');
        gridElement.style.gridTemplateColumns = `repeat(${cols}, 25px)`;
        
        let grid = [];
        let startNode = { r: 10, c: 5 };
        let targetNode = { r: 10, c: 34 };
        
        // System variables for dragging and locking
        let isMousePressed = false;
        let isAlgorithmRunning = false;

        function createGrid() {
            gridElement.innerHTML = '';
            grid = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    
                    if (r === startNode.r && c === startNode.c) cell.classList.add('start');
                    else if (r === targetNode.r && c === targetNode.c) cell.classList.add('target');
                    
                    // Upgraded Mouse Events for "Drag to Draw"
                    cell.addEventListener('mousedown', () => {
                        if (isAlgorithmRunning) return;
                        isMousePressed = true;
                        toggleWall(r, c, cell);
                    });
                    
                    cell.addEventListener('mouseenter', () => {
                        if (isAlgorithmRunning || !isMousePressed) return;
                        toggleWall(r, c, cell);
                    });
                    
                    cell.addEventListener('mouseup', () => isMousePressed = false);
                    
                    gridElement.appendChild(cell);
                    row.push({ r, c, isWall: false, previousNode: null, element: cell });
                }
                grid.push(row);
            }
        }
        
        // Stop drawing if mouse leaves the whole grid area
        gridElement.addEventListener('mouseleave', () => isMousePressed = false);

        function toggleWall(r, c, cell) {
            if ((r === startNode.r && c === startNode.c) || (r === targetNode.r && c === targetNode.c)) return;
            
            grid[r][c].isWall = !grid[r][c].isWall;
            if (grid[r][c].isWall) {
                cell.classList.add('wall');
            } else {
                cell.classList.remove('wall');
            }
        }

        function clearGrid() {
            if (isAlgorithmRunning) return;
            createGrid();
        }

        // Helper: Animation delay
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function getNeighbors(node) {
            const { r, c } = node;
            const neighbors = [];
            // Order matters for visual feel. Usually: Up, Right, Down, Left
            if (r > 0) neighbors.push(grid[r - 1][c]);       
            if (c < cols - 1) neighbors.push(grid[r][c + 1]); 
            if (r < rows - 1) neighbors.push(grid[r + 1][c]); 
            if (c > 0) neighbors.push(grid[r][c - 1]);       
            return neighbors.filter(n => !n.isWall);
        }

        // --- ALGORITHMS ---
        
        async function runAlgorithm(type) {
            if (isAlgorithmRunning) return;
            isAlgorithmRunning = true;
            toggleButtons(true);

            // Clean up previous runs but keep walls
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c].previousNode = null;
                    grid[r][c].element.classList.remove('visited', 'path');
                }
            }

            let dataStructure = [grid[startNode.r][startNode.c]];
            let visited = new Set([`${startNode.r},${startNode.c}`]);
            let found = false;
            
            while (dataStructure.length > 0) {
                // BFS uses shift() [Queue], DFS uses pop() [Stack]
                let current = type === 'bfs' ? dataStructure.shift() : dataStructure.pop(); 
                
                if (current.r === targetNode.r && current.c === targetNode.c) {
                    found = true;
                    break; 
                }

                if (current.r !== startNode.r || current.c !== startNode.c) {
                    current.element.classList.add('visited');
                    await sleep(10); // Speed of search animation
                }

                let neighbors = getNeighbors(current);
                
                for (let neighbor of neighbors) {
                    let key = `${neighbor.r},${neighbor.c}`;
                    if (!visited.has(key)) {
                        visited.add(key);
                        neighbor.previousNode = current; // Track the path backward
                        dataStructure.push(neighbor); 
                    }
                }
            }

            if (found) {
                await tracePath(grid[targetNode.r][targetNode.c]);
            } else {
                alert("No path found! The target is completely blocked.");
            }

            isAlgorithmRunning = false;
            toggleButtons(false);
        }

        // Trace backwards from target to start using the previousNode property
        async function tracePath(endNode) {
            let currentNode = endNode.previousNode;
            let pathArray = [];
            
            while (currentNode.r !== startNode.r || currentNode.c !== startNode.c) {
                pathArray.push(currentNode);
                currentNode = currentNode.previousNode;
            }
            
            // Reverse so it draws from start to target
            pathArray.reverse();
            
            for (let node of pathArray) {
                node.element.classList.remove('visited');
                node.element.classList.add('path');
                await sleep(25); // Speed of drawing the final line
            }
        }

        function toggleButtons(disable) {
            document.getElementById('btn-bfs').disabled = disable;
            document.getElementById('btn-dfs').disabled = disable;
            document.getElementById('btn-clear').disabled = disable;
        }

        // Boot it up
        createGrid();
    </script>
</body>
</html>
